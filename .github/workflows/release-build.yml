name: Release Build & Package (OpenMedia Premiere Pro Plugin)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag to publish (e.g. v3.0.0)'
        required: false
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Test (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows-x64
            installer_name: OpenMedia-PremierePlugin-v3.0.0-Windows-x64-Setup.exe
            portable_name: OpenMedia-PremierePlugin-v3.0.0-Windows-x64-Portable.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Clean-Room License & GPL Contamination Audit
        run: python packaging/scripts/audit_licenses.py

      - name: Download & Install FFmpeg Shared Development Libraries (Windows x64)
        shell: pwsh
        run: |
          $ffmpegZip = Join-Path $env:RUNNER_TEMP "ffmpeg-shared-win64.zip"
          $ffmpegExtract = Join-Path $env:RUNNER_TEMP "ffmpeg-sdk"
          New-Item -ItemType Directory -Force -Path $ffmpegExtract | Out-Null

          $ffmpegUrl = "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip"
          Write-Host "Downloading FFmpeg shared SDK from $ffmpegUrl ..."
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip -UseBasicParsing

          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $ffmpegRoot = (Get-ChildItem -Path $ffmpegExtract -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path (Join-Path $ffmpegRoot "include/libavcodec/avcodec.h"))) {
              throw "FFmpeg headers not found under $ffmpegRoot"
          }
          Write-Host "FFMPEG_ROOT resolved to: $ffmpegRoot"
          echo "FFMPEG_ROOT=$ffmpegRoot" >> $env:GITHUB_ENV
          echo "$ffmpegRoot\bin" >> $env:GITHUB_PATH

      - name: Configure CMake (Release with FFmpeg Shared Engine)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DFFMPEG_ROOT="$env:FFMPEG_ROOT" `
            -DADOBE_PP_SDK="${{ github.workspace }}/tests/mocks/mock_sdk"

      - name: Build OpenMediaCore, Dual-PRM Importers (.prm), Exporter (.prm) & Test Suite
        run: cmake --build build --config Release --parallel

      - name: Run Full CTest Suite (52/52 Unit, Integration, Benchmarks & Packaging)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build Standalone Windows .exe Installer (NSIS) & Portable ZIP
        shell: pwsh
        run: |
          $stageDir = Join-Path $env:GITHUB_WORKSPACE "dist/OpenMedia-PremierePlugin-Windows-x64"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item "build/bin/OpenMedia_Importer.prm" -Destination $stageDir -Force
          Copy-Item "build/bin/OpenMedia_ImporterHP.prm" -Destination $stageDir -Force
          Copy-Item "build/bin/OpenMedia_Exporter.prm" -Destination $stageDir -Force
          Copy-Item "build/bin/OpenMediaCore.dll" -Destination $stageDir -Force
          Copy-Item "build/bin/OpenMediaDesktop.exe" -Destination $stageDir -Force
          Copy-Item "build/bin/av*.dll" -Destination $stageDir -Force
          Copy-Item "build/bin/sw*.dll" -Destination $stageDir -Force
          Copy-Item "packaging/Config.toml" -Destination $stageDir -Force
          Copy-Item "THIRD_PARTY_LICENSES.md" -Destination $stageDir -Force
          Copy-Item "README.md" -Destination $stageDir -Force

          Write-Host "Staged files for packaging:"
          Get-ChildItem $stageDir | Select-Object Name, Length

          Compress-Archive -Path "$stageDir/*" -DestinationPath "${{ matrix.portable_name }}" -Force

          $makensis = "makensis"
          if (-not (Get-Command $makensis -ErrorAction SilentlyContinue)) {
              $nsiCandidate = "C:\Program Files (x86)\NSIS\makensis.exe"
              if (Test-Path $nsiCandidate) {
                  $makensis = $nsiCandidate
              } else {
                  choco install nsis -y --no-progress
                  $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
              }
          }

          $outInstaller = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.installer_name }}"
          & $makensis "/DSTAGE_DIR=$stageDir" "/DOUTFILE=$outInstaller" "packaging/cpack/windows/openmedia_installer.nsi"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $outInstaller)) {
              throw "NSIS installer generation failed"
          }

          Get-ChildItem "${{ matrix.installer_name }}", "${{ matrix.portable_name }}" | Select-Object Name, Length

      - name: Upload Release Package Artifact (${{ matrix.platform_name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_name }}-Release-Package
          path: |
            ${{ matrix.installer_name }}
            ${{ matrix.portable_name }}
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            echo "tag_name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v3.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "OpenMedia Premiere Pro & Media Encoder Plugin ${{ steps.tag.outputs.tag_name }} — Windows x64"
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/OpenMedia-PremierePlugin-v3.0.0-Windows-x64-Setup.exe
            release-assets/OpenMedia-PremierePlugin-v3.0.0-Windows-x64-Portable.zip
            release-assets/SHA256SUMS.txt
          body: |
            ## OpenMedia Premiere Pro & Adobe Media Encoder Plugin (`${{ steps.tag.outputs.tag_name }}` — Windows x64)
            Native **MKV / WebM / Ogg** Dual-PRM Importer (`VP9`, `AV1`, `Opus`, `Vorbis`, `FLAC`, `xHE-AAC`, `PCM`) and **AV1 / VP9** Exporter (`SVT-AV1`, `libaom-av1`, `libvpx-vp9`, `NVENC`, `AMF`, `QSV`, `Vulkan`) for Adobe Premiere Pro & Adobe Media Encoder on Windows x64.

            ### Included Release Assets
            - **`OpenMedia-PremierePlugin-v3.0.0-Windows-x64-Setup.exe`** (Standalone Native Windows x64 NSIS Installer with Bundled FFmpeg/Codec Runtime DLLs):
              - Requests Administrator privileges (`RequestExecutionLevel admin`) and supports silent enterprise deployment (`/S`).
              - Verifies Microsoft Visual C++ 2015–2022 Redistributable (x64) (`$SYSDIR\VCRUNTIME140.dll` & `$SYSDIR\VCRUNTIME140_1.dll`) before installation.
              - Installs directly into `C:\Program Files\Adobe\Common\Plug-ins\7.0\MediaCore`:
                1. `OpenMedia_Importer.prm` (Normal Priority `100` / `0x00`, `xImportEntry` with full 14-selector media & async pipeline)
                2. `OpenMedia_ImporterHP.prm` (High-Priority Override `200` / `0x01`, `xImportEntry`)
                3. `OpenMedia_Exporter.prm` (AV1 / VP9 / MKV / WebM Exporter, `xSDKExport` with `PiPL`/`EXPT` resources)
                4. `OpenMediaDesktop.exe` (Bilingual EN LTR / AR RTL Control Center & Host Popup)
                5. `OpenMediaCore.dll` + Full FFmpeg Shared Codec Engine (`avcodec-*.dll`, `avformat-*.dll`, `avutil-*.dll`, `swscale-*.dll`, `swresample-*.dll`, `avfilter-*.dll`, `avdevice-*.dll`)
                5. `Config.toml` (Default Influx-v2 Dual-PRM & GPU Decode Policy configuration)
                6. `THIRD_PARTY_LICENSES.md` & `README.md`
              - Registers `Uninstall-OpenMedia.exe` in Windows Add/Remove Programs.
            - **`OpenMedia-PremierePlugin-v3.0.0-Windows-x64-Portable.zip`** (Complete portable archive containing `.prm` plugins, `OpenMediaCore.dll`, all FFmpeg/codec `.dll` libraries, `Config.toml`, `THIRD_PARTY_LICENSES.md`, and `README.md`).
            - **`SHA256SUMS.txt`** (SHA-256 cryptographic checksums).
