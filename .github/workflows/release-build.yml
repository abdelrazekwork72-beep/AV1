name: Release Build & Package (OpenMedia Premiere Pro Plugin)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag to publish (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Test (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows-x64
            archive_name: OpenMedia-PremierePlugin-v1.0.0-Windows-x64.zip
          - os: macos-latest
            platform_name: macOS-Universal
            archive_name: OpenMedia-PremierePlugin-v1.0.0-macOS.zip
          - os: ubuntu-latest
            platform_name: Linux-x64
            archive_name: OpenMedia-PremierePlugin-v1.0.0-Linux-x64.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Clean-Room License & GPL Contamination Audit
        run: python packaging/scripts/audit_licenses.py

      - name: Install FFmpeg Development Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libavcodec-dev libavformat-dev libswscale-dev libswresample-dev libavutil-dev

      - name: Install FFmpeg Development Libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config ffmpeg

      - name: Configure CMake (Release)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DADOBE_PP_SDK="${{ github.workspace }}/tests/mocks/mock_sdk"

      - name: Build OpenMediaCore, Dual-PRM Importers (.prm/.bundle), Exporter (.prm/.bundle) & Test Suite
        run: cmake --build build --config Release --parallel

      - name: Run Full CTest Suite (Unit, Integration, Benchmarks & Packaging)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows MediaCore Plugin Bundle (Dual-PRM + Config.toml + VC++ Check)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageDir = "dist/OpenMedia-PremierePlugin-Windows-x64"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item "build/bin/OpenMedia_Importer.prm" -Destination $stageDir -Force
          Copy-Item "build/bin/OpenMedia_ImporterHP.prm" -Destination $stageDir -Force
          Copy-Item "build/bin/OpenMedia_Exporter.prm" -Destination $stageDir -Force
          Copy-Item "build/bin/OpenMediaCore.dll" -Destination $stageDir -Force
          Copy-Item "packaging/Config.toml" -Destination $stageDir -Force
          Copy-Item "THIRD_PARTY_LICENSES.md" -Destination $stageDir -Force
          Copy-Item "README.md" -Destination $stageDir -Force

          $installScript = @'
          # Requires -RunAsAdministrator
          $ErrorActionPreference = "Stop"

          $System32 = Join-Path $env:SystemRoot "System32"
          $VcRuntime = Join-Path $System32 "VCRUNTIME140.dll"
          $VcRuntime1 = Join-Path $System32 "VCRUNTIME140_1.dll"
          if (-not (Test-Path $VcRuntime) -or -not (Test-Path $VcRuntime1)) {
              Write-Error "Missing Microsoft Visual C++ 2015-2022 Redistributable (x64): VCRUNTIME140.dll or VCRUNTIME140_1.dll not found in $System32. Please download and install vc_redist.x64.exe from https://aka.ms/vs/17/release/vc_redist.x64.exe before installing OpenMedia plugins."
              exit 1
          }

          $TargetDir = "C:\Program Files\Adobe\Common\Plug-ins\7.0\MediaCore"
          if (-not (Test-Path $TargetDir)) {
              New-Item -ItemType Directory -Force -Path $TargetDir | Out-Null
          }
          Copy-Item "$PSScriptRoot\OpenMedia_Importer.prm" -Destination $TargetDir -Force
          Copy-Item "$PSScriptRoot\OpenMedia_ImporterHP.prm" -Destination $TargetDir -Force
          Copy-Item "$PSScriptRoot\OpenMedia_Exporter.prm" -Destination $TargetDir -Force
          Copy-Item "$PSScriptRoot\OpenMediaCore.dll" -Destination $TargetDir -Force
          Copy-Item "$PSScriptRoot\Config.toml" -Destination $TargetDir -Force
          Copy-Item "$PSScriptRoot\THIRD_PARTY_LICENSES.md" -Destination $TargetDir -Force
          Write-Host "[OpenMedia] Installed Dual-PRM Importers (OpenMedia_Importer.prm, OpenMedia_ImporterHP.prm), OpenMedia_Exporter.prm, OpenMediaCore.dll, and Config.toml to $TargetDir" -ForegroundColor Green
          '@
          Set-Content -Path "$stageDir/Install-MediaCore.ps1" -Value $installScript -Encoding UTF8

          Compress-Archive -Path "$stageDir/*" -DestinationPath "${{ matrix.archive_name }}" -Force
          Get-ChildItem "${{ matrix.archive_name }}"

      - name: Package macOS MediaCore Plugin Bundle (Dual-PRM + Config.toml + Installer Script)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          STAGE_DIR="dist/OpenMedia-PremierePlugin-macOS"
          mkdir -p "$STAGE_DIR"

          cp -R build/bin/OpenMedia_Importer.bundle "$STAGE_DIR/"
          cp -R build/bin/OpenMedia_ImporterHP.bundle "$STAGE_DIR/"
          cp -R build/bin/OpenMedia_Exporter.bundle "$STAGE_DIR/"
          cp build/bin/libOpenMediaCore.dylib "$STAGE_DIR/"
          cp packaging/Config.toml "$STAGE_DIR/"
          cp THIRD_PARTY_LICENSES.md "$STAGE_DIR/"
          cp README.md "$STAGE_DIR/"

          cat << 'EOF' > "$STAGE_DIR/install-mediacore.sh"
          #!/usr/bin/env bash
          set -euo pipefail
          TARGET_DIR="/Library/Application Support/Adobe/Common/Plug-ins/7.0/MediaCore"
          sudo mkdir -p "$TARGET_DIR"
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          sudo cp -R "$SCRIPT_DIR/OpenMedia_Importer.bundle" "$TARGET_DIR/"
          sudo cp -R "$SCRIPT_DIR/OpenMedia_ImporterHP.bundle" "$TARGET_DIR/"
          sudo cp -R "$SCRIPT_DIR/OpenMedia_Exporter.bundle" "$TARGET_DIR/"
          sudo cp "$SCRIPT_DIR/libOpenMediaCore.dylib" "$TARGET_DIR/"
          sudo cp "$SCRIPT_DIR/Config.toml" "$TARGET_DIR/"
          sudo cp "$SCRIPT_DIR/THIRD_PARTY_LICENSES.md" "$TARGET_DIR/"
          sudo chmod -R 755 "$TARGET_DIR/OpenMedia_Importer.bundle" "$TARGET_DIR/OpenMedia_ImporterHP.bundle" "$TARGET_DIR/OpenMedia_Exporter.bundle"
          echo "[OpenMedia] Installed Dual-PRM bundles, OpenMedia_Exporter.bundle, libOpenMediaCore.dylib, and Config.toml to $TargetDir"
          EOF
          chmod +x "$STAGE_DIR/install-mediacore.sh"

          (cd "$STAGE_DIR" && zip -r "${GITHUB_WORKSPACE}/${{ matrix.archive_name }}" .)
          ls -lh "${{ matrix.archive_name }}"

      - name: Package Linux MediaCore Shared Libraries (.so + Config.toml + CPack TGZ)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          STAGE_DIR="dist/OpenMedia-PremierePlugin-Linux-x64"
          mkdir -p "$STAGE_DIR"

          cp build/bin/libOpenMediaCore.so* "$STAGE_DIR/" 2>/dev/null || true
          cp build/bin/*OpenMedia_Importer* "$STAGE_DIR/" 2>/dev/null || true
          cp build/bin/*OpenMedia_Exporter* "$STAGE_DIR/" 2>/dev/null || true
          cp packaging/Config.toml "$STAGE_DIR/"
          cp THIRD_PARTY_LICENSES.md "$STAGE_DIR/"
          cp README.md "$STAGE_DIR/"

          tar -czf "${{ matrix.archive_name }}" -C "$STAGE_DIR" .
          ls -lh "${{ matrix.archive_name }}"

      - name: Upload Release Package Artifact (${{ matrix.platform_name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_name }}-Release-Package
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            echo "tag_name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "OpenMedia Premiere Pro & Media Encoder Plugin ${{ steps.tag.outputs.tag_name }}"
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/OpenMedia-PremierePlugin-v1.0.0-Windows-x64.zip
            release-assets/OpenMedia-PremierePlugin-v1.0.0-macOS.zip
            release-assets/OpenMedia-PremierePlugin-v1.0.0-Linux-x64.tar.gz
            release-assets/SHA256SUMS.txt
          body: |
            ## OpenMedia Premiere Pro & Adobe Media Encoder Plugin (`${{ steps.tag.outputs.tag_name }}`)
            Native **MKV / WebM / Ogg** Dual-PRM Importer (`VP9`, `AV1`, `Opus`, `Vorbis`, `FLAC`) and **AV1 / VP9** Exporter (`SVT-AV1`, `libaom-av1`, `libvpx-vp9`, `NVENC`, `AMF`, `QSV`) for Adobe Premiere Pro & Adobe Media Encoder.

            ### Included Binaries
            - **Windows x64 (`OpenMedia-PremierePlugin-v1.0.0-Windows-x64.zip`)**:
              - `OpenMedia_Importer.prm` (Normal priority `0x00`, `xImportEntry`)
              - `OpenMedia_ImporterHP.prm` (High priority `0x01`, `xImportEntry`)
              - `OpenMedia_Exporter.prm` (`xSDKExport`)
              - `OpenMediaCore.dll`
              - `Config.toml` (Dual-PRM & CPU/GPU decode policy configuration)
              - `Install-MediaCore.ps1` (One-click installer with VC++ Redistributable check to `C:\Program Files\Adobe\Common\Plug-ins\7.0\MediaCore`)
              - `THIRD_PARTY_LICENSES.md`
            - **macOS (`OpenMedia-PremierePlugin-v1.0.0-macOS.zip`)**:
              - `OpenMedia_Importer.bundle`
              - `OpenMedia_ImporterHP.bundle`
              - `OpenMedia_Exporter.bundle`
              - `libOpenMediaCore.dylib`
              - `Config.toml`
              - `install-mediacore.sh` (Installer script to `/Library/Application Support/Adobe/Common/Plug-ins/7.0/MediaCore`)
              - `THIRD_PARTY_LICENSES.md`
